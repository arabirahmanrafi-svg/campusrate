spring.application.name=campusrate

# --- Database (MySQL) ---
# Values come from environment variables, with local defaults for development.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/campusrate?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}

# Flyway owns the schema (see db/migration), so Hibernate must never change tables itself.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# --- App settings ---
server.port=${PORT:8081}

# Secret used to sign login tokens. MUST be overridden in production (at least 32 characters).
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-0123456789}
app.jwt.expiration-minutes=1440

# Only student email addresses can sign up.
app.allowed-email-domains=.edu,.ac.uk,.edu.au,.ac.in,.edu.bd,.ac.bd,.edu.sg,.ac.jp,.ac.kr,.edu.cn,.ac.za

# Accounts with these emails become admins when they sign up or log in (comma-separated).
app.admin-emails=${ADMIN_EMAILS:}

# The React app's address, allowed to call this API from the browser.
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# How many reviews a school needs before its own average is trusted in rankings (the "C" in the Bayesian average).
app.ranking.min-reviews-weight=10

# --- Photo uploads ---
# Uploaded images are saved in this folder; only the file name is stored in MySQL.
app.upload-dir=${UPLOAD_DIR:uploads}
# New photos stay hidden until an admin approves them.
app.photos.require-approval=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# --- Rate limits (per user, or per IP address when logged out) ---
app.rate-limit.writes-per-10-minutes=40
app.rate-limit.logins-per-minute=10
