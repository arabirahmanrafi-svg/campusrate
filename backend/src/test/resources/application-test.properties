# Integration tests use their own MySQL database (campusrate_test), so they never
# touch your real data. It's created automatically and wiped at the start of each test run.
spring.datasource.url=${TEST_DB_URL:jdbc:mysql://localhost:3306/campusrate_test?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}

# Allows the tests to wipe the test database before running (never enable this in the main app).
spring.flyway.clean-disabled=false

# Tests create many accounts quickly, so loosen the rate limits.
app.rate-limit.writes-per-10-minutes=10000
app.rate-limit.logins-per-minute=10000

# The integration test signs this account up to check the admin endpoints.
app.admin-emails=admin@test.edu

# Photos uploaded by tests go to a throwaway folder.
app.upload-dir=target/test-uploads
